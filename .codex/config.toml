# This layer selects the globally defined maintainer profile and declares both
# sides of the main-repository/worktree boundary as effective workspace roots.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
project_doc_max_bytes = 65536
personality = "pragmatic"

approval_policy = "on-request"
approvals_reviewer = "user"
default_permissions = "repo-maintainer"

[agents]
max_concurrent_threads_per_session = 3
max_depth = 1

[permissions.repo-maintainer.workspace_roots]
"~/projects/frontier-clean" = true
"~/.codex" = true
"~/.claude" = true
"~/.agents" = true
"~/frontier" = true

[permissions.repo-maintainer.filesystem]
"~/.codex/config.toml" = "read"
"~/.local" = "deny"
"~/.local/bin" = "write"
"~/.agents/skills" = "write"
"~/projects/frontier-clean/.hidden" = "deny"
"~/frontier/.hidden" = "deny"
